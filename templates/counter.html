<!doctype html>
<html lang="ro">
<head>
{% include "_head.html" %}
<title>Stepper</title>
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; gap: 10px; overflow: hidden; -webkit-user-select: none; user-select: none; }
.topbar .nav a { padding: 6px 10px; font-size: 13px; }
#status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#hrBtn { padding: 6px 12px; border-radius: 999px; font-size: 14px; gap: 6px; }
#hrBtn .heart { color: var(--hr); }
#hrBtn b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1; }
#hrBtn.live { border-color: var(--hr); }
#hrBtn.stale b { color: var(--muted); }
#hrBtn.nobt { opacity: .55; }
.topbar .right { display: flex; align-items: center; gap: 6px; }
#status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
#status.ok i { background: var(--up); }
#status.lost i { background: var(--warn); }
#cam { position: relative; width: 100%; max-height: 30vh; aspect-ratio: 3/4; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid var(--line); }
#cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#cam.mirror video, #cam.mirror canvas { transform: scaleX(-1); }
#camMsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px; color: var(--muted); font-size: 14px; background: rgba(0,0,0,.55); }
#sparkRow { display: flex; align-items: center; gap: 10px; }
#spark { flex: 1; min-width: 0; height: 46px; display: block; }
#sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
#readout { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 0; }
#elev { font-family: var(--display); font-weight: 700; font-size: min(34vw, 22vh); line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
#elev small { font-size: .38em; font-weight: 600; color: var(--accent); margin-left: .08em; }
#elev.pulse { animation: pulse .35s ease-out; }
@keyframes pulse { from { color: var(--up); } to { color: var(--fg); } }
#stats { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; gap: 8px; margin-top: 10px; }
.stat { text-align: center; }
.stat b { display: block; font-family: var(--display); font-weight: 600; font-size: min(11vw, 7vh); font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
#legs { width: 100%; margin-top: 14px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
#legs .side { font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
#legs .side b { font-family: var(--display); font-size: 26px; color: var(--fg); letter-spacing: 0; margin: 0 4px; font-variant-numeric: tabular-nums; }
#legs .side.last b { color: var(--up); }
#legBar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
#legBar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
#legBar i + i { background: #6fb3ff; }
#controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; padding-bottom: 12px; }
#controls button { padding: 14px 8px; }
#go { font-size: 20px; }
#go:not(.running) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.adj { display: flex; gap: 6px; }
.adj button { flex: 1; padding: 14px 0 !important; font-size: 18px; }
#sheet { position: fixed; inset: 0; background: rgba(5,9,13,.7); display: flex; align-items: flex-end; z-index: 20; }
#sheet .box { background: var(--panel); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; -webkit-user-select: text; user-select: text; }
#sheet h2.title { font-family: var(--display); font-size: 24px; margin: 0; letter-spacing: .03em; color: var(--fg); text-transform: none; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row label { flex: 1; }
.row label small { display: block; color: var(--muted); font-size: 12px; }
.row input[type=number] { width: 96px; text-align: right; }
.row select { width: auto; }
input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); }
#countdown { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 40vw; font-weight: 700; color: var(--accent); background: rgba(15,23,32,.85); z-index: 30; }
#confirmNew { display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: reduce) { #elev.pulse { animation: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div id="status"><i></i><span id="statusText">Pregătit</span></div>
  <div class="right">
    <button id="hrBtn" aria-label="Conectează centura de puls"><span class="heart">♥</span><b id="hrVal">Puls</b></button>
    <nav class="nav"><a href="/istoric">Istoric</a><a href="/cont">Cont</a></nav>
  </div>
</header>

<div id="cam" class="mirror">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="camMsg">Apasă Start. Telefonul cere acces la cameră.</div>
</div>
<div id="sparkRow"><canvas id="spark"></canvas><span id="sync"></span></div>

<main id="readout">
  <div id="elev">0.0<small>m</small></div>
  <div id="stats">
    <div class="stat"><b id="climbs">0</b><span>urcări</span></div>
    <div class="stat"><b id="time">0:00</b><span>timp</span></div>
    <div class="stat"><b id="rate">–</b><span>m / oră</span></div>
  </div>
  <div id="legs" aria-label="Urcări pe fiecare picior">
    <span class="side" id="sideL">Stâng<b id="cntL">0</b></span>
    <div id="legBar"><i id="barL" style="width:50%"></i><i id="barR" style="width:50%"></i></div>
    <span class="side" id="sideR"><b id="cntR">0</b>Drept</span>
  </div>
</main>

<div id="controls">
  <button id="menu" aria-label="Setări">Setări</button>
  <button id="go">Start</button>
  <div class="adj">
    <button id="minus" aria-label="Scade o urcare">−</button>
    <button id="plus" aria-label="Adaugă o urcare">+</button>
  </div>
</div>

<div id="sheet" hidden>
  <div class="box">
    <div class="row"><h2 class="title">Setări</h2><button id="close">Gata</button></div>
    <div id="confirmNew">
      <button id="newSession">Încheie sesiunea și începe una nouă</button>
      <span class="muted small">Sesiunea curentă e salvată în istoric pe măsură ce urci.</span>
    </div>
    <div class="row"><label for="height">Înălțime treaptă<small>cm per urcare</small></label><input id="height" type="number" min="5" max="60" step="0.5" inputmode="decimal"></div>
    <div class="row"><label for="facing">Camera</label><select id="facing"><option value="user">Față (vezi ecranul)</option><option value="environment">Spate</option></select></div>
    <div class="row"><label for="beep">Bip la fiecare urcare</label><input id="beep" type="checkbox"></div>
    <div class="row"><label for="voice">Anunț vocal<small>la fiecare 10 m</small></label><input id="voice" type="checkbox"></div>
    <div class="row" id="hrHelp"><label>Puls live<small id="hrHelpTxt"></small></label></div>
    <div class="row"><label for="swapLR">Inversează stânga / dreapta<small>dacă piciorul numărat e invers față de realitate</small></label><input id="swapLR" type="checkbox"></div>
    <h2>Detecție</h2>
    <div class="row"><label for="upTh">Prag sus<small>cât trebuie să urci, în lungimi de trunchi (implicit 0.30)</small></label><input id="upTh" type="number" min="0.1" max="1" step="0.02"></div>
    <div class="row"><label for="downTh">Prag jos<small>revenire la podea (implicit 0.12)</small></label><input id="downTh" type="number" min="0" max="0.5" step="0.02"></div>
    <div class="row"><label for="model">Model<small>Lite e mai rapid; Full e mai precis</small></label><select id="model"><option value="0">Lite</option><option value="1">Full</option></select></div>
  </div>
</div>
<div id="countdown" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script>
// ---- COUNTER (pure logic; validated offline against a recorded session) ----
// Signal: vertical position of the torso centre (mid of shoulders+hips), normalised by torso length,
// so it is independent of distance to the camera. d = how far above the floor level, in torso lengths.
function createCounter(opts) {
  const o = Object.assign({ up: 0.30, down: 0.12, minVis: 0.5 }, opts);
  let state = 'down', floor = null, torso = null, climbs = 0, d = 0, jumpRun = 0;
  return {
    reset() { state = 'down'; floor = null; torso = null; climbs = 0; d = 0; jumpRun = 0; },
    relevel() { floor = null; torso = null; state = 'down'; jumpRun = 0; },
    set(k, v) { o[k] = v; },
    get climbs() { return climbs; }, set climbs(v) { climbs = Math.max(0, v); },
    get d() { return d; }, get state() { return state; }, get opts() { return o; },
    // lm: 33 landmarks {x,y,visibility}; returns 'climb' when a new climb is detected, 'lost' if unusable, else null
    push(lm) {
      if (!lm) return 'lost';
      const k = [11, 12, 23, 24];
      if (k.some(i => (lm[i].visibility ?? 1) < o.minVis)) return 'lost';
      const sy = (lm[11].y + lm[12].y) / 2, hy = (lm[23].y + lm[24].y) / 2;
      const y = (sy + hy) / 2, tl = hy - sy;
      if (tl <= 0.02) return 'lost';
      if (torso !== null && Math.abs(tl / torso - 1) > 0.35) {
        // sudden scale jump: someone walking to/from the camera. Ignore; re-level if it persists ~2 s.
        if (++jumpRun > 30) { torso = tl; floor = y; state = 'down'; jumpRun = 0; }
        return 'lost';
      }
      jumpRun = 0;
      torso = torso === null ? tl : torso + 0.05 * (tl - torso);
      if (floor === null) floor = y;
      d = (floor - y) / torso;
      if (state === 'down') {
        floor += (y > floor ? 0.1 : 0.02) * (y - floor);
        if (d > o.up) { state = 'up'; climbs++; return 'climb'; }
      } else if (d < o.down) {
        state = 'down';
      }
      return null;
    }
  };
}
// Lead leg: in the ~1.7 s before a climb is detected, the leg stepping onto the box lifts its knee
// toward the hip. a = (right knee-hip gap) - (left knee-hip gap); a > 0 means the left knee is higher.
// The sign of the largest asymmetry in the window names the lead leg; below 0.035 it is undecided.
function createLeadDetector(windowMs = 1700, minAsym = 0.035) {
  let buf = [];
  return {
    push(t, lm) {
      if (!lm || [23, 24, 25, 26].some(i => (lm[i].visibility ?? 1) < 0.5)) return;
      buf.push([t, (lm[26].y - lm[24].y) - (lm[25].y - lm[23].y)]);
      while (buf.length && buf[0][0] < t - windowMs) buf.shift();
    },
    decide() {
      let best = 0;
      for (const [, a] of buf) if (Math.abs(a) > Math.abs(best)) best = a;
      buf = [];
      return Math.abs(best) < minAsym ? '?' : (best > 0 ? 'L' : 'R');
    }
  };
}
// ---- END COUNTER ----

const $ = id => document.getElementById(id);
const local = {
  get(k, def) { try { const v = localStorage.getItem('stepper.' + k); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem('stepper.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('stepper.' + k); } catch {} }
};
const cfg = Object.assign({ height: 22, facing: 'user', beep: true, voice: true, up: 0.30, down: 0.12, model: 0, swapLR: false }, {{ settings|tojson }});
const counter = createCounter({ up: cfg.up, down: cfg.down });

// Current workout. Persisted locally on every change so a reload or crash never loses it;
// pushed to the server as full state (idempotent), so retries are safe.
const UID = {{ g.user.id }};
let W = local.get('current', null); // {uid, id, started_at, height_cm, climbs:[ms], active_ms}
if (W && W.uid !== UID) W = null;    // a session left on this phone by another account
let running = false, startedAt = 0, stream = null, pose = null, busy = false;
let wakeLock = null, audio = null, lastAnnounce = 0, lastStatus = '', dirty = false, syncing = false;
const trace = [];
const lead = createLeadDetector(), frameTimes = [];

// ---- Live heart rate (standard Bluetooth Heart Rate service: Polar H9/H10 and most chest straps) ----
// Needs Web Bluetooth: Chrome on Android/desktop; on iPhone only through a Safari extension that adds it.
const HR = { dev: null, bpm: null, at: 0, lastSaved: 0 };
const hasBT = !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
function parseHR(dv) { const flags = dv.getUint8(0); return flags & 1 ? dv.getUint16(1, true) : dv.getUint8(1); }
function showHR() {
  const fresh = HR.bpm && Date.now() - HR.at < 5000;
  $('hrVal').textContent = HR.dev ? (fresh ? HR.bpm : '…') : 'Puls';
  $('hrBtn').classList.toggle('live', !!HR.dev); $('hrBtn').classList.toggle('stale', !!HR.dev && !fresh);
}
async function hrSubscribe(dev) {
  const server = await dev.gatt.connect();
  const ch = await (await server.getPrimaryService('heart_rate')).getCharacteristic('heart_rate_measurement');
  ch.addEventListener('characteristicvaluechanged', e => {
    const bpm = parseHR(e.target.value); if (bpm < 25 || bpm > 250) return;
    HR.bpm = bpm; HR.at = Date.now(); showHR();
    // keep one sample every 2 s while a session is running
    if (running && W && HR.at - HR.lastSaved >= 2000) { (W.hr = W.hr || []).push([HR.at, bpm]); HR.lastSaved = HR.at; markDirty(); }
  });
  await ch.startNotifications();
}
async function hrConnect() {
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    HR.dev = dev; showHR();
    dev.addEventListener('gattserverdisconnected', async () => {
      // the strap drops out when you move away or it loses skin contact; retry a few times
      for (let i = 0; i < 5 && HR.dev === dev; i++) {
        await new Promise(r => setTimeout(r, 2000 * (i + 1)));
        try { await hrSubscribe(dev); return; } catch {}
      }
      if (HR.dev === dev) { HR.dev = null; showHR(); }
    });
    await hrSubscribe(dev);
  } catch (e) {
    if (e && e.name !== 'NotFoundError') { HR.dev = null; showHR(); setStatus('lost', 'Puls: ' + (e.message || e.name)); }
  }
}
$('hrBtn').classList.toggle('nobt', !hasBT);
$('hrBtn').onclick = () => {
  if (hasBT) { if (!HR.dev) hrConnect(); return; }
  fillSettings(); $('sheet').hidden = false; $('hrHelp').scrollIntoView({ block: 'center' });
};
setInterval(showHR, 2000);
if (W && typeof W.legs !== 'string') W.legs = '?'.repeat(W.climbs.length);
if (W) { lastAnnounce = Math.floor(elevation() / 10) * 10; $('go').textContent = 'Continuă'; dirty = true; }

function newWorkout() { W = { uid: UID, id: null, started_at: Date.now(), height_cm: cfg.height, climbs: [], legs: '', hr: [], active_ms: 0 }; saveLocal(); }
function saveLocal() { local.set('current', W); }

// ---- Server sync ----
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', keepalive: !!body && JSON.stringify(body).length < 60000 });
  if (r.status === 401) { location.href = '/login?next=/'; throw new Error('auth'); }
  if (r.status === 404 && W && url.endsWith('/' + W.id)) { W.id = null; saveLocal(); } // deleted on the server: recreate
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function sync() {
  if (!W || syncing || !dirty) return;
  syncing = true; dirty = false;
  try {
    if (!W.id) { const r = await api('POST', '/api/workouts', { started_at: W.started_at, height_cm: W.height_cm }); W.id = r.id; saveLocal(); }
    await api('PUT', '/api/workouts/' + W.id, { climbs: W.climbs, legs: W.legs, hr: W.hr && W.hr.length ? W.hr : undefined, active_ms: Math.round(elapsed()), ended_at: Date.now() });
    $('sync').textContent = 'Salvat';
  } catch (e) {
    dirty = true; $('sync').textContent = 'Nesalvat · reîncerc';
  } finally { syncing = false; }
}
function markDirty() { dirty = true; saveLocal(); }
setInterval(sync, 10000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (W) W.active_ms = Math.round(elapsed()); markDirty(); sync(); } });

// ---- UI ----
function fmtTime(ms) { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`; }
function elapsed() { return (W ? W.active_ms : 0) + (running ? performance.now() - startedAt : 0); }
function nClimbs() { return W ? W.climbs.length : 0; }
function elevation() { return W ? W.climbs.length * W.height_cm / 100 : 0; }
function render() {
  const e = elevation();
  $('elev').firstChild.nodeValue = e < 100 ? e.toFixed(1) : e.toFixed(0);
  $('climbs').textContent = nClimbs();
  const t = elapsed(); $('time').textContent = fmtTime(t);
  $('rate').textContent = t > 30000 && nClimbs() ? Math.round(e / (t / 3600000)) : '–';
  const legs = W ? W.legs : '', nL = (legs.match(/L/g) || []).length, nR = (legs.match(/R/g) || []).length;
  $('cntL').textContent = nL; $('cntR').textContent = nR;
  const pL = nL + nR ? Math.round(nL / (nL + nR) * 100) : 50;
  $('barL').style.width = pL + '%'; $('barR').style.width = (100 - pL) + '%';
  const last = legs.slice(-1);
  $('sideL').classList.toggle('last', last === 'L'); $('sideR').classList.toggle('last', last === 'R');
}
function setStatus(kind, text) {
  if (kind + text === lastStatus) return; lastStatus = kind + text;
  $('status').className = kind; $('statusText').textContent = text;
}
setInterval(() => { if (running) render(); }, 500);

// ---- Feedback ----
function beep(freq, dur) {
  if (!cfg.beep || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
  const t = audio.currentTime; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}
function say(text) {
  if (!cfg.voice || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ro-RO'; speechSynthesis.speak(u);
}
function addClimb(leg = '?') {
  if (cfg.swapLR && leg !== '?') leg = leg === 'L' ? 'R' : 'L';
  W.climbs.push(Date.now()); W.legs += leg; markDirty();
  const e = elevation();
  beep(nClimbs() % 10 === 0 ? 1320 : 880, 0.12);
  const ten = Math.floor(e / 10) * 10;
  if (ten > lastAnnounce) { lastAnnounce = ten; say(`${ten} metri`); }
  const el = $('elev'); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  render();
}

// ---- Drawing ----
const EDGES = [[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28]];
function drawPose(lm) {
  const c = $('overlay'), v = $('video');
  if (c.width !== v.videoWidth) { c.width = v.videoWidth; c.height = v.videoHeight; }
  const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
  if (!lm) return;
  const W_ = c.width, H = c.height;
  x.lineWidth = Math.max(2, W_ / 160); x.strokeStyle = counter.state === 'up' ? '#5fd39a' : '#ffa24c';
  x.beginPath();
  for (const [a, b] of EDGES) { x.moveTo(lm[a].x * W_, lm[a].y * H); x.lineTo(lm[b].x * W_, lm[b].y * H); }
  x.stroke();
  const cy = ((lm[11].y + lm[12].y + lm[23].y + lm[24].y) / 4) * H, cx = ((lm[23].x + lm[24].x) / 2) * W_;
  x.fillStyle = '#e8eef3'; x.beginPath(); x.arc(cx, cy, Math.max(4, W_ / 70), 0, 7); x.fill();
}
const MAXTRACE = 150;
function drawSpark() {
  const c = $('spark'), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const x = c.getContext('2d'), Wd = c.width, H = c.height; x.clearRect(0, 0, Wd, H);
  const lo = -0.2, hi = 0.8, Y = v => H - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * H;
  x.lineWidth = dpr; x.setLineDash([4 * dpr, 4 * dpr]);
  x.strokeStyle = '#5fd39a88'; x.beginPath(); x.moveTo(0, Y(cfg.up)); x.lineTo(Wd, Y(cfg.up)); x.stroke();
  x.strokeStyle = '#ffa24c88'; x.beginPath(); x.moveTo(0, Y(cfg.down)); x.lineTo(Wd, Y(cfg.down)); x.stroke();
  x.setLineDash([]);
  if (trace.length < 2) return;
  x.strokeStyle = '#e8eef3'; x.lineWidth = 2 * dpr; x.beginPath();
  trace.forEach((v, i) => { const px = i / (MAXTRACE - 1) * Wd; i ? x.lineTo(px, Y(v)) : x.moveTo(px, Y(v)); });
  x.stroke();
}

// ---- Camera + pose ----
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: cfg.facing, width: { ideal: 640 }, height: { ideal: 480 } } });
  const v = $('video'); v.srcObject = stream; await v.play();
  $('cam').classList.toggle('mirror', cfg.facing === 'user');
  $('camMsg').hidden = true;
}
async function startPose() {
  if (pose) return;
  setStatus('', 'Încarc modelul…');
  pose = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}` });
  pose.setOptions({ modelComplexity: +cfg.model, smoothLandmarks: true, enableSegmentation: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
  pose.onResults(r => {
    const lm = r.poseLandmarks || null;
    drawPose(lm);
    if (!running) { setStatus(lm ? 'ok' : 'lost', lm ? 'Te văd' : 'Nu te văd'); return; }
    const now = performance.now(); frameTimes.push(now); while (frameTimes[0] < now - 2000) frameTimes.shift();
    const fps = Math.round(frameTimes.length / 2), fpsTxt = ` · ${fps} fps`;
    lead.push(now, lm);
    const res = counter.push(lm);
    if (res === 'lost') setStatus('lost', 'Nu te văd întreg' + fpsTxt);
    else { setStatus(fps < 5 ? 'lost' : 'ok', (counter.state === 'up' ? 'Sus' : 'Jos') + fpsTxt); trace.push(counter.d); if (trace.length > MAXTRACE) trace.shift(); drawSpark(); }
    if (res === 'climb') addClimb(lead.decide());
  });
  try {
    await pose.initialize();
  } catch (e) {
    try { pose.close(); } catch {}
    pose = null; // so the next Start retries loading instead of running with a dead model
    const err = new Error(String(e && e.message || e));
    err.stage = 'model'; throw err;
  }
  loop();
}
async function loop() {
  const v = $('video');
  if (!busy && v.readyState >= 2) {
    busy = true;
    try { await pose.send({ image: v }); } catch (e) { console.error(e); }
    busy = false;
  }
  requestAnimationFrame(loop);
}
async function requestWake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') requestWake(); });

// ---- Session ----
function countdown(n) {
  return new Promise(res => {
    const el = $('countdown'); el.hidden = false; el.textContent = n;
    const t = setInterval(() => { n--; if (n <= 0) { clearInterval(t); el.hidden = true; res(); } else { el.textContent = n; beep(660, 0.08); } }, 1000);
  });
}
function pause() {
  if (!running) return;
  W.active_ms += performance.now() - startedAt; running = false;
  $('go').textContent = 'Continuă'; $('go').classList.remove('running');
  try { wakeLock && wakeLock.release(); } catch {}
  markDirty(); sync(); render();
}
$('go').onclick = async () => {
  if (running) return pause();
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); // unlock on iOS
    if (!stream) await startCamera();
    await startPose();
  } catch (e) {
    const msg = e.message || e.name;
    $('camMsg').hidden = false;
    $('camMsg').textContent = e.stage === 'model'
      ? (/unsafe-eval|Content Security Policy/i.test(msg)
          ? 'Serverul blochează WebAssembly (header CSP), deci modelul nu poate rula. Pagina trebuie servită fără acel header.'
          : 'Nu pot încărca modelul de detecție: ' + msg + '. Verifică internetul și apasă din nou Start.')
      : 'Nu pot porni camera: ' + msg + '. Verifică permisiunea pentru cameră în Setări > Safari.';
    setStatus('lost', 'Eroare'); return;
  }
  requestWake();
  const fresh = !W;
  if (fresh) await countdown(5);
  if (!W) newWorkout();
  counter.relevel(); trace.length = 0;
  running = true; startedAt = performance.now();
  $('go').textContent = 'Pauză'; $('go').classList.add('running');
  markDirty(); sync();
};
$('plus').onclick = () => { if (!W) newWorkout(); addClimb(); };
$('minus').onclick = () => { if (W && W.climbs.length) { W.climbs.pop(); W.legs = W.legs.slice(0, W.climbs.length); markDirty(); render(); } };

$('newSession').onclick = async () => {
  pause();
  if (W) { W.active_ms = Math.round(elapsed()); markDirty(); await sync(); }
  const done = W && W.id && (W.climbs.length || W.active_ms > 60000) ? W.id : null;
  W = null; local.del('current'); counter.reset(); lastAnnounce = 0; trace.length = 0;
  $('go').textContent = 'Start'; $('sync').textContent = ''; render(); drawSpark(); $('sheet').hidden = true;
  if (done) location.href = '/sesiune/' + done;
};

// ---- Settings ----
function fillSettings() {
  $('hrHelpTxt').textContent = hasBT
    ? (HR.dev ? `Conectat: ${HR.dev.name || 'centură'}` : 'Apasă ♥ Puls din colțul de sus ca să alegi centura.')
    : (navigator.standalone || matchMedia('(display-mode: standalone)').matches
        ? 'Ai deschis aplicația de pe ecranul principal, unde extensiile Safari nu rulează. Deschide-o din Safari: adaug-o din nou pe ecranul principal cu „Deschide ca aplicație web” dezactivat.'
        : 'Browserul ăsta nu are Bluetooth pentru pagini web. Pe iPhone: instalează extensia beacio, activeaz-o în Safari pentru acest site, apoi reîncarcă pagina.');
  $('height').value = cfg.height; $('facing').value = cfg.facing; $('beep').checked = cfg.beep; $('voice').checked = cfg.voice; $('swapLR').checked = cfg.swapLR;
  $('upTh').value = cfg.up; $('downTh').value = cfg.down; $('model').value = cfg.model;
  $('newSession').disabled = !W;
}
$('menu').onclick = () => { fillSettings(); $('sheet').hidden = false; };
$('close').onclick = async () => {
  const prevFacing = cfg.facing, prevModel = cfg.model;
  cfg.height = Math.min(60, Math.max(5, parseFloat($('height').value) || 22));
  cfg.facing = $('facing').value; cfg.beep = $('beep').checked; cfg.voice = $('voice').checked; cfg.swapLR = $('swapLR').checked;
  cfg.up = Math.min(1, Math.max(0.1, parseFloat($('upTh').value) || 0.30));
  cfg.down = Math.min(cfg.up - 0.05, Math.max(0, parseFloat($('downTh').value) || 0.12));
  cfg.model = +$('model').value;
  counter.set('up', cfg.up); counter.set('down', cfg.down);
  // The step height applies from the next session; changing it mid-session would rewrite past climbs.
  $('sheet').hidden = true; render(); drawSpark();
  api('POST', '/api/settings', cfg).catch(() => {});
  if (stream && prevFacing !== cfg.facing) { try { await startCamera(); counter.relevel(); } catch {} }
  if (pose && prevModel !== cfg.model) pose.setOptions({ modelComplexity: cfg.model });
};
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('close').onclick(); };

render(); drawSpark(); sync();
</script>
</body>
</html>
